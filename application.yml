app:
  name: Booking
  business_function: MIDDLE_OFFICE
  pillar: "Booking & PNL & REG"
  flow-enrichment:
    data-field: data
    frequency-field: frequency

spring:
  rabbitmq:
    template:
      exchange: settlement.cashflows
      routing-key: cashflow
      consumed-by-application: Settlement
      connection-kind: MQ
      message:
        data: cashflow
        frequency: daily

clients:
  documentation:
    url: https://documentation.internal/api/v1/confirmations
    application: Documentation
    connection-kind: API
    channel: /api/v1/confirmations
    data: trade
    frequency: real-time
  datahub-trades:
    url: https://datahub.internal/api/v1/eod-trades
    application: DataHub
    connection-kind: API
    channel: /api/v1/eod-trades
    data: trade
    frequency: daily
  datahub-cashflows:
    url: https://datahub.internal/api/v1/eod-cashflows
    application: DataHub
    connection-kind: API
    channel: /api/v1/eod-cashflows
    data: cashflow
    frequency: daily

api:
  trades:
    path: /api/v1/trades
    called-by-application: Trading/Pricing
    connection-kind: API
    data: trade
    frequency: real-time

callers:
  - Trading/Pricing
